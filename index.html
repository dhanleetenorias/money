<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <!-- One colour for both schemes: the app is dark regardless of the phone's
         setting, so a light theme-color would tint the status bar white above
         a dark page. -->
    <meta name="theme-color" content="#0d0f0e" />
    <title>Money</title>
    <link rel="icon" href="./favicon.png" type="image/png" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <!-- iOS uses apple-touch-icon over anything in the manifest, and renders
         alpha as BLACK — every icon here is opaque RGB. 180 is the size an
         @3x iPhone actually wants; the larger ones are for the manifest and
         for whatever crops the OS decides to do. -->
    <link rel="apple-touch-icon" sizes="180x180" href="./icons/icon-180.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="./icons/icon-192.png" />
    <link rel="apple-touch-icon" sizes="256x256" href="./icons/icon-256.png" />
    <link rel="apple-touch-icon" sizes="512x512" href="./icons/icon-512.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Money" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <link rel="stylesheet" href="./app.css" />
    <style>
      /* Boot splash only — matches app.css's --bg so there's no flash before
         the stylesheet applies. This block is UNLAYERED, so it outranks every
         @layer rule in app.css no matter how specific those are: a light
         override lived here after the light palette was deleted, and it
         repainted the page white under text still tuned for dark. If --bg
         changes, change it here too. */
      html,
      body {
        background: #0d0f0e;
        margin: 0;
        height: 100%;
      }
      #app-boot {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #34d399;
        font:
          500 16px/1.4 -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
        letter-spacing: 0.02em;
      }
    </style>
  </head>
  <body>
    <noscript
      >Money requires JavaScript to run. Please enable JavaScript in your
      browser settings.</noscript
    >
    <div id="app"><div id="app-boot">Loading&hellip;</div></div>
    <script type="module" src="./js/main.js"></script>
  </body>
</html>
