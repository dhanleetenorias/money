<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <meta
      name="theme-color"
      media="(prefers-color-scheme: dark)"
      content="#0d0f0e"
    />
    <meta
      name="theme-color"
      media="(prefers-color-scheme: light)"
      content="#f2f4f3"
    />
    <title>Money</title>
    <link rel="icon" href="./favicon.png" type="image/png" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <!-- iOS uses apple-touch-icon over anything in the manifest, and renders
         alpha as BLACK — every icon here is opaque RGB. 180 is the size an
         @3x iPhone actually wants; the larger ones are for the manifest and
         for whatever crops the OS decides to do. -->
    <link rel="apple-touch-icon" sizes="180x180" href="./icons/icon-180.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="./icons/icon-192.png" />
    <link rel="apple-touch-icon" sizes="256x256" href="./icons/icon-256.png" />
    <link rel="apple-touch-icon" sizes="512x512" href="./icons/icon-512.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Money" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <link rel="stylesheet" href="./app.css" />
    <style>
      /* Boot splash only. Must track app.css's two palettes or a light-mode
         phone flashes a dark page before the stylesheet applies. */
      html,
      body {
        background: #0d0f0e;
        margin: 0;
        height: 100%;
      }
      @media (prefers-color-scheme: light) {
        html,
        body {
          background: #f2f4f3;
        }
        #app-boot {
          color: #047857;
        }
      }
      #app-boot {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #34d399;
        font:
          500 16px/1.4 -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
        letter-spacing: 0.02em;
      }
    </style>
  </head>
  <body>
    <noscript
      >Money requires JavaScript to run. Please enable JavaScript in your
      browser settings.</noscript
    >
    <div id="app"><div id="app-boot">Loading&hellip;</div></div>
    <script type="module" src="./js/main.js"></script>
  </body>
</html>
