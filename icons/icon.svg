<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- MONEY — app icon master. Everything else is rendered from this file.
       Opaque background on purpose: alpha renders BLACK in an iOS
       apple-touch-icon. The ring is the budget split — one bright arc for the
       45% that gets saved, the rest dim. At home-screen size it reads as a
       ring around a peso mark; up close it says what the app is for. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#141a18"/>
      <stop offset="1" stop-color="#0b0d0c"/>
    </linearGradient>
    <linearGradient id="save" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4ade9f"/>
      <stop offset="1" stop-color="#22b57e"/>
    </linearGradient>
  </defs>

  <rect width="1024" height="1024" fill="url(#bg)"/>

  <!-- Ring track -->
  <circle cx="512" cy="512" r="374" fill="none" stroke="#252c2a" stroke-width="52"/>

  <!-- 45% saved. Starts at 12 o'clock, sweeps clockwise.
       circumference = 2*pi*374 = 2350.0; 45% = 1057.5 -->
  <circle cx="512" cy="512" r="374" fill="none" stroke="url(#save)" stroke-width="52"
          stroke-linecap="round" stroke-dasharray="1057.5 1292.5"
          transform="rotate(-90 512 512)"/>

  <!-- Peso mark. Stem + bowl + the two crossbars that make it a ₱. -->
  <g fill="#f2f5f4">
    <rect x="360" y="330" width="74" height="372" rx="34"/>
    <path d="M400 330h108a132 132 0 0 1 0 264H400v-74h108a58 58 0 0 0 0-116H400z"/>
    <rect x="300" y="424" width="330" height="58" rx="29"/>
    <rect x="300" y="524" width="330" height="58" rx="29"/>
  </g>
</svg>
